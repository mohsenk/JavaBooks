title: "Awesome Java Books"
tagline: "The best Java books, curated and organized by level"
description: >-
  A curated, hand-reviewed guide to the best Java books for beginners,
  intermediate and advanced developers — covering core Java, concurrency,
  design patterns, Spring, and interview prep.
url: "https://mohsenk.github.io"
baseurl: "/JavaBooks"
repository: "mohsenk/JavaBooks"
lang: en_US
locale: en_US
author:
  name: "Mohsen Karimi"
logo: /assets/img/logo.svg
social:
  name: Awesome Java Books
  links:
    - https://github.com/mohsenk/JavaBooks

collections_dir: ""

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: /assets/img/social-card.png

category_pages:
  - slug: beginner
    title: "Beginner Java Books"
  - slug: intermediate
    title: "Intermediate Java Books"
  - slug: advanced
    title: "Advanced Java & Concurrency Books"
  - slug: design-architecture
    title: "Design Patterns & Architecture Books"
  - slug: spring-enterprise
    title: "Spring & Enterprise Java Books"
  - slug: interview-prep
    title: "Interview Prep & Certification Books"
