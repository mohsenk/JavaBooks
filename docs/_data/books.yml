        oreilly: "https://www.oreilly.com/search/?q=JUnit%20in%20Action%20Third%20Edition"
        publisher: "https://www.manning.com/books/junit-in-action-third-edition"

- category: "Advanced Java & Concurrency"
  slug: "advanced"
  icon: "⚙️"
  level_label: "Advanced"
  intro: "These books go beyond day-to-day application code into how the JVM actually runs your programs — Java concurrency and multithreading, garbage collection, JIT compilation, generics internals, and performance tuning. They're written for developers who already know Java well and want to diagnose real production problems, not just follow generic tuning checklists."
  books:
    - title: "Java Concurrency in Practice"
      author: "Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes, Doug Lea"
      year: 2006
      isbn13: "9780321349606"
      publisher: "Addison-Wesley"
      level: "Advanced"
      blurb: "Written by Brian Goetz together with several members of the JSR-166 expert group (including Doug Lea and Joshua Bloch), this book breaks down the theory and practice of writing correct, thread-safe Java code — covering the Java Memory Model, locks, atomics, and the java.util.concurrent library. It remains the book many teams point new hires to before they touch multithreaded code. Best suited for developers who already know core Java and want a rigorous mental model for concurrency rather than a quick tutorial."
      best_for: "Developers who need a rigorous foundation in Java concurrency"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9780321349606-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9780321349606"
        oreilly: "https://www.oreilly.com/search/?q=Java%20Concurrency%20in%20Practice"
        publisher: "https://www.pearson.com/en-us/subject-catalog/p/java-concurrency-in-practice/P200000009374/9780321349606"

    - title: "Java Performance: In-Depth Advice for Tuning and Programming Java 8, 11, and Beyond"
      author: "Scott Oaks"
      edition: "2nd Edition"
      year: 2020
      isbn13: "9781492056119"
      publisher: "O'Reilly Media"
      level: "Advanced"
      blurb: "Scott Oaks explains how the HotSpot JVM actually executes and optimizes code, then applies that to garbage collection tuning, JIT compilation, threading, and I/O performance. This second edition updates the original guide for Java 8 and 11, including newer collectors like G1. It suits engineers who need to diagnose real production performance problems rather than follow generic tuning checklists."
      best_for: "Engineers tuning JVM performance and GC behavior in production"
      cover_image_url: "https://images-na.ssl-images-amazon.com/images/P/1492056111.01.LZZZZZZZ.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781492056119"
        oreilly: "https://www.oreilly.com/library/view/java-performance-2nd/9781492056102/"
        publisher: "https://www.oreilly.com/library/view/java-performance-2nd/9781492056102/"

    - title: "Optimizing Java: Practical Techniques for Improving JVM Application Performance"
      author: "Benjamin J. Evans, James Gough, Chris Newland"
      year: 2018
      isbn13: "9781492025795"
      publisher: "O'Reilly Media"
      level: "Advanced"
      blurb: "Evans, Gough, and Newland lay out a measurement-first approach to Java performance work, showing how to benchmark correctly, read JIT compiler output, and reason about memory and concurrency costs before making changes. The book leans on tooling — JITWatch, profilers, flight recorder — more than a typical tuning book, reflecting the authors' backgrounds in JVM tooling and low-latency systems. It's aimed at practitioners who want a repeatable, evidence-based process rather than folklore."
      best_for: "Practitioners who want a tooling-driven, evidence-based approach to JVM tuning"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9781492025795-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781492025795"
        oreilly: "https://www.oreilly.com/library/view/optimizing-java/9781492039259/"
        publisher: "https://www.oreilly.com/library/view/optimizing-java/9781492039259/"

    - title: "Java Performance Companion"
      author: "Charlie Hunt, Poonam Parhar, Bengt Rutisson, Monica Beckwith"
      year: 2016
      isbn13: "9780133796827"
      publisher: "Addison-Wesley Professional"
      level: "Advanced"
      blurb: "Written by current and former Oracle JVM engineers, this book picks up where general performance guides leave off, going deep on the Garbage-First (G1) collector's internals and the HotSpot Serviceability Agent for postmortem diagnosis. It's less a general tuning primer and more a specialist reference for engineers who already understand JVM basics and need to reason about GC log internals or debug a live JVM with its own serviceability tooling."
      best_for: "JVM specialists debugging GC internals and using the Serviceability Agent"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9780133796827-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9780133796827"
        oreilly: "https://www.oreilly.com/search/?q=Java%20Performance%20Companion"
        publisher: "https://www.pearson.com/en-us/subject-catalog/p/java-performance-companion/P200000009127/9780133796827"

    - title: "Java Generics and Collections: Fundamentals and Recommended Practices"
      author: "Maurice Naftalin, Philip Wadler, Stuart Marks"
      edition: "2nd Edition"
      year: 2025
      isbn13: "9781098136727"
      publisher: "O'Reilly Media"
      level: "Advanced"
      blurb: "Naftalin and Wadler give one of the clearest explanations available of how Java generics actually work under erasure, including the wildcard rules and corner cases that trip up even experienced developers, paired with a thorough tour of the Collections Framework. This second edition brings the material up to Java 21, adding coverage of sequenced collections and how streams and lambdas interact with generic code. Good for developers who use generics daily but want to understand the type system well enough to design their own generic APIs."
      best_for: "Developers who want to master Java's generics and collections type system"
      cover_image_url: "https://images-na.ssl-images-amazon.com/images/P/1098136721.01.LZZZZZZZ.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781098136727"
        oreilly: "https://www.oreilly.com/library/view/java-generics-and/9781098136710/"
        publisher: "https://www.oreilly.com/library/view/java-generics-and/9781098136710/"

    - title: "Netty in Action"
      author: "Norman Maurer, Marvin Allen Wolfthal"
      year: 2015
      isbn13: "9781617291470"
      publisher: "Manning Publications"
      level: "Advanced"
      blurb: "Written by one of Netty's core maintainers, this book explains the asynchronous, event-driven Netty framework that underlies many high-throughput Java network servers — channels, event loops, and codecs for building non-blocking clients and servers. It favors hands-on examples over API reference dumps, showing why so much Java infrastructure tooling is built on top of it. Best suited for developers who already write concurrent Java and need to build or maintain high-performance network services."
      best_for: "Developers building high-throughput, non-blocking network servers in Java"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9781617291470-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781617291470"
        oreilly: "https://www.oreilly.com/search/?q=Netty%20in%20Action"
        publisher: "https://www.manning.com/books/netty-in-action"

- category: "Design Patterns & Architecture"
  slug: "design-architecture"
  icon: "🏛️"
  level_label: "Design & Architecture"
  intro: "These are the foundational reads Java developers reach for when they want to move past working code toward well-structured code — the original design pattern catalog, the books that shaped how the Java ecosystem thinks about clean code and clean architecture, and the enterprise and domain modeling classics that still underpin Spring-style application design today."
  books:
    - title: "Design Patterns: Elements of Reusable Object-Oriented Software"
      author: "Erich Gamma, Richard Helm, Ralph Johnson, John Vlissides"
      year: 1994
      isbn13: "9780201633610"
      publisher: "Addison-Wesley"
      level: "Advanced"
      blurb: "Written by the 'Gang of Four,' this is the book that gave the industry a shared vocabulary of 23 object-oriented patterns, from Singleton to Visitor. Its examples are in C++ and Smalltalk rather than Java, but nearly every Java framework and API you use today (java.util.Iterator, Spring's factories, decorators in java.io) is built on the vocabulary this book introduced. Best treated as a reference to dip into once you already have some OOP experience, not a first read."
      best_for: "Developers who want the original vocabulary behind object-oriented design patterns"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9780201633610-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9780201633610"
        oreilly: "https://www.oreilly.com/library/view/design-patterns-elements/0201633612/"
        publisher: "https://www.oreilly.com/library/view/design-patterns-elements/0201633612/"

    - title: "Head First Design Patterns: Building Extensible and Maintainable Object-Oriented Software"
      author: "Eric Freeman, Elisabeth Robson"
      edition: "2nd Edition"
      year: 2021
      isbn13: "9781492078005"
      publisher: "O'Reilly Media"
      level: "Intermediate"
      blurb: "A friendly, visually driven walkthrough of the same core design patterns the GoF catalog defined, but explained through worked scenarios, diagrams, and running Java code rather than dense prose. The second edition updates its examples for modern Java (lambdas, streams) and is generally considered the easiest on-ramp into design patterns for working developers. Good as a companion or a more approachable alternative to the original GoF book."
