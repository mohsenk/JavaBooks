        publisher: "https://www.mheducation.com/highered/product/java-beginner-s-guide-ninth-edition-schildt/9781260463552.html"

    - title: "Java For Dummies"
      author: "Barry Burd"
      edition: "8th Edition"
      year: 2022
      isbn13: "9781119861645"
      publisher: "For Dummies (Wiley)"
      level: "Beginner"
      blurb: "A friendly, jargon-light entry point that assumes nothing and explains Java concepts through plain-language analogies before showing the code. Written by a longtime computer science professor, it covers building classes and objects, then moves into newer features added through Java 17. Its casual tone makes it a comfortable starting point for readers intimidated by denser textbooks."
      best_for: "Total beginners who want the gentlest possible on-ramp"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9781119861645-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781119861645"
