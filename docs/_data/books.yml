        publisher: "https://horstmann.com/corejava.html"

    - title: "Murach's Java Programming"
      author: "Joel Murach"
      edition: "6th Edition"
      year: 2022
      isbn13: "9781943872879"
      publisher: "Mike Murach & Associates"
      level: "Beginner"
      blurb: "A paced, exercise-driven textbook aimed squarely at people with zero programming background, built around Murach's signature 'paired pages' format that pairs explanation with runnable code side by side. It covers both NetBeans and Eclipse workflows and builds toward small complete applications rather than isolated snippets. Its classroom pedigree makes it a solid choice for self-study or a first course."
