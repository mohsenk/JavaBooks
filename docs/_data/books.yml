    - title: "Java by Comparison: Become a Java Craftsman in 70 Examples"
      author: "Simon Harrer, Jörg Lenhard, Linus Dietz"
      year: 2018
      isbn13: "9781680502879"
      publisher: "Pragmatic Bookshelf"
      level: "Intermediate"
      blurb: "A short, focused book built entirely around side-by-side before-and-after code examples — each one taking a common but flawed snippet and showing exactly how and why to improve it. It covers naming, exception handling, testing, and general code hygiene rather than any single Java feature. Best suited to developers who already know the syntax and now want to write code a teammate would actually enjoy reviewing."
      best_for: "Developers who want tighter, more professional-looking code"
