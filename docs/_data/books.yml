        publisher: "https://www.wiley.com/en-us/search?pq=Java%20For%20Dummies%2C%208th%20Edition"

    - title: "Beginning Java Programming: The Object-Oriented Approach"
      author: "Bart Baesens, Aimée Backiel, Seppe vanden Broucke"
      year: 2015
      isbn13: "9781118739495"
      publisher: "Wrox (Wiley)"
      level: "Beginner"
      blurb: "Developed from a university course the authors taught, this book builds up object-oriented thinking gradually alongside Java syntax, using an IDE-based workflow and exercises based on realistic business scenarios. Its final chapters use case studies that tie multiple concepts together into small working systems. A good fit for readers who want an academic, business-context flavor rather than a hobbyist tone."
      best_for: "Career-changers and students wanting a business-oriented intro"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9781118739495-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781118739495"
        oreilly: "https://www.oreilly.com/search/?q=Beginning%20Java%20Programming%20Object-Oriented%20Approach"
        publisher: "https://www.wiley.com/en-us/Beginning+Java+Programming%3A+The+Object-Oriented+Approach-p-9781118739495"

- category: "Intermediate Java Books"
  slug: "intermediate"
  icon: "📘"
  level_label: "Intermediate"
  intro: "Once you're comfortable with Java syntax, these are the best intermediate Java books for leveling up your skills — collections, generics, streams, lambdas, and cleaner idioms that separate a working programmer from a confident one. Each pick below focuses on writing more expressive, maintainable Java rather than absolute-beginner basics or deep JVM internals."
  books:
    - title: "Effective Java"
      author: "Joshua Bloch"
      edition: "3rd Edition"
      year: 2018
      isbn13: "9780134685991"
      publisher: "Addison-Wesley"
      level: "Intermediate"
      blurb: "Joshua Bloch's item-by-item guide distills decades of API design experience from his time leading Java platform work at Sun and Google into concrete, justified rules covering generics, enums, lambdas, streams, and object lifecycle. The 3rd edition folds in Java 7 through 9 features while keeping the same terse, example-driven format. It works both as a cover-to-cover read once you already know core Java and as a reference to consult when a specific design question comes up."
      best_for: "Java developers who want to write more idiomatic, defensible code"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9780134685991-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9780134685991"
        oreilly: "https://www.oreilly.com/search/?q=Effective%20Java"
        publisher: "https://www.pearson.com/en-us/subject-catalog/p/effective-java/P200000000138/9780134685991"

    - title: "Modern Java in Action: Lambdas, Streams, Functional and Reactive Programming"
      author: "Raoul-Gabriel Urma, Mario Fusco, Alan Mycroft"
      year: 2018
      isbn13: "9781617293566"
      publisher: "Manning Publications"
      level: "Intermediate"
      blurb: "This is the book that reframes how you think about Java once lambdas and streams enter the picture. It walks from basic lambda syntax through the Streams API, then into more advanced functional patterns like Optional and CompletableFuture, with a light touch on reactive programming and the module system. Written for developers who already write Java daily but still reach for old-style loops and mutation out of habit."
      best_for: "Developers moving to functional-style, stream-based Java"
      cover_image_url: "https://covers.openlibrary.org/b/isbn/9781617293566-L.jpg"
      purchase_links:
        amazon: "https://www.amazon.com/s?k=9781617293566"
        oreilly: "https://www.oreilly.com/search/?q=Modern%20Java%20in%20Action"
        publisher: "https://www.manning.com/books/modern-java-in-action"

    - title: "Core Java, Volume II—Advanced Features"
      author: "Cay S. Horstmann"
      edition: "12th Edition"
      year: 2022
      isbn13: "9780137871070"
      publisher: "Pearson / Oracle Press"
      level: "Intermediate"
      blurb: "The companion to Horstmann's Volume I, this book picks up once you know core syntax and moves into streams, XML, networking, databases, internationalization, and security APIs. It's organized as a reference you dip into chapter by chapter rather than read cover to cover. A solid pick for developers who want authoritative, example-heavy coverage of the standard library's less-basic corners."
      best_for: "Developers who want a deep reference beyond core syntax"
      cover_image_url: "https://www.informit.com/ShowCover.aspx?isbn=9780137871070&type=f"
