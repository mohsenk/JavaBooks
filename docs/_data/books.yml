      edition: "9th Edition"
      year: 2022
      isbn13: "9781260463552"
      publisher: "McGraw Hill"
      level: "Beginner"
      blurb: "A step-by-step, no-prior-experience-assumed guide from the author of Java: The Complete Reference, walking readers from installing a JDK through writing, compiling, and running their first programs. It's updated for Java SE 17 and gradually introduces multithreading, generics, lambdas, and Swing after covering the core language. A shorter, friendlier companion to Schildt's much bigger reference book."
