      isbn13: "9781680509793"
      publisher: "Pragmatic Bookshelf"
      level: "Intermediate"
      blurb: "A hands-on introduction to thinking functionally in Java, built around small, practical exercises rather than theory. It covers lambdas, method references, and the Streams API, then goes further into error handling and refactoring imperative code into functional style. Good for developers who understand streams syntactically but still write imperative code out of reflex."
