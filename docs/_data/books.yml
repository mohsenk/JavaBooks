      blurb: "Written explicitly for developers past the beginner stage, this book brings you up to speed on everything that changed in Java from version 8 onward — modules, newer language features, build tooling with Maven and Gradle, and a broad tour of the wider JVM ecosystem including Kotlin. It's intentionally wide-ranging rather than narrowly focused, making it a good way to fill gaps in a developer's mental map of modern Java."
